name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: civicguard
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: civicguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civicguard -d civicguard_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CIVICGUARD_TEST_DATABASE_URL: postgresql+psycopg://civicguard:local-ci-only@127.0.0.1:5432/civicguard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements-production.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-details
          path: test-results/
          retention-days: 7
