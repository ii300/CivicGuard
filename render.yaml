# Creates a paid web service and persistent PostgreSQL. Review Render's estimate.
services:
  - type: web
    name: civicguard-web
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements-production.txt
    preDeployCommand: flask --app app db upgrade
    startCommand: gunicorn --config gunicorn.conf.py wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: civicguard-db
          property: connectionString
      - key: MAIL_BACKEND
        value: smtp
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: civicguard-db
    region: oregon
    plan: 0.1c-256mb
    databaseName: civicguard
    user: civicguard
    ipAllowList: []
